name: Glass Rooms
version: "1.1.9"
breaking_versions:
  - "1.0.11"
  - "1.1.0"
slug: glass_rooms
description: "Panell local per a iPad amb inventari i controls configurables"
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: true
homeassistant_api: true
hassio_api: false
host_network: false
ingress: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Panell privat LAN; HTTP o TLS directe segons els certificats configurats"
map:
  - type: ssl
    read_only: true
options:
  light_entity_ids: []
  entity_ids: []
  panel_pin: ""
  app_token: ""
  allowed_hosts: []
  allowed_networks: []
  verified_actions: []
  room_assignments: []
  alarm_modes: []
  alarm_arm_code: unknown
  alarm_disarm_code: unknown
  tls_certfile: ""
  tls_keyfile: ""
schema:
  light_entity_ids:
    - str
  entity_ids:
    - str
  panel_pin: password
  app_token: "password?"
  allowed_hosts:
    - str
  allowed_networks:
    - str
  verified_actions:
    - str
  room_assignments:
    - str
  alarm_modes:
    - "list(alarm_arm_home|alarm_arm_away|alarm_arm_night|alarm_arm_vacation)"
  alarm_arm_code: "list(unknown|required|none)"
  alarm_disarm_code: "list(unknown|required|none)"
  tls_certfile: str
  tls_keyfile: str
